<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preload" as="image" href="/earnx-eagle-logo.png"/>
<link rel="stylesheet" href="/assets/styles-DCEfU-8i.css"/>
<title>Reset Your Password — EarnX-Finance</title>
<meta name="description" content="Reset your EarnX-Finance password and get back to earning."/>
<meta property="og:title" content="Reset Your Password — EarnX-Finance"/>
<meta property="og:description" content="Reset your EarnX-Finance password."/>
<meta property="og:type" content="website"/>
<link rel="icon" href="/earnx-eagle-logo.png" type="image/png"/>
</head>
<body>
<main class="relative flex min-h-screen flex-col bg-hero-glow px-4 py-8 sm:px-6">
    <div aria-hidden="true" class="pointer-events-none absolute -left-20 top-10 h-56 w-56 rounded-full bg-royal-gradient opacity-30 blur-3xl animate-float-slow"></div>
    <div aria-hidden="true" class="pointer-events-none absolute -right-16 bottom-10 h-56 w-56 rounded-full bg-gold-gradient opacity-15 blur-3xl animate-float"></div>
    <div class="relative mx-auto flex w-full max-w-md flex-1 flex-col">
        <div class="flex items-center justify-between">
            <a class="flex items-center" aria-label="EarnX-Finance home" href="/">
                <img src="/earnx-eagle-logo.png" alt="EarnX-Finance logo" width="640" height="494" class="w-auto shrink-0 object-contain h-10 sm:h-11"/>
            </a>
            <a class="text-xs font-medium text-muted-foreground transition-colors hover:text-foreground" href="/">Back to home</a>
        </div>

        <div class="mt-8 animate-[rise_0.6s_ease-out] rounded-3xl surface-card p-6 sm:p-8">
            <h1 class="font-display text-2xl font-extrabold sm:text-3xl">Forgot your password?</h1>
            <p class="mt-2 text-sm leading-relaxed text-muted-foreground">Enter the email address on your account and we'll send you a secure reset link.</p>

            <div class="mt-6">
                <form id="forgotPasswordForm" class="space-y-4" novalidate>
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="email">Email address</label>
                        <input type="email" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 md:text-sm" id="email" name="email" autocomplete="email" placeholder="you@example.com" required/>
                    </div>
                    <p id="resetMessage" class="hidden text-sm leading-relaxed" role="status" aria-live="polite"></p>
                    <button id="resetButton" class="relative inline-flex select-none items-center justify-center gap-2 overflow-hidden whitespace-nowrap rounded-full font-semibold transition-all duration-300 active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:pointer-events-none disabled:opacity-50 bg-gold-gradient text-gold-foreground shadow-gold-glow hover:brightness-110 h-13 px-8 text-base w-full" type="submit">
                        <span id="resetButtonText" class="relative z-10 inline-flex items-center gap-2">Send reset link</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-6 text-center text-sm text-muted-foreground">Remembered it? <a class="font-semibold text-gold hover:underline" href="/login">Back to login</a></div>
    </div>
</main>

<script src="/back4app-config.js"></script>
<script>
(function () {
    const form = document.getElementById("forgotPasswordForm");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("resetButton");
    const buttonText = document.getElementById("resetButtonText");
    const message = document.getElementById("resetMessage");

    function showMessage(text, type) {
        message.textContent = text;
        message.classList.remove("hidden", "text-destructive", "text-green-600", "text-muted-foreground");

        if (type === "success") {
            message.classList.add("text-green-600");
        } else if (type === "error") {
            message.classList.add("text-destructive");
        } else {
            message.classList.add("text-muted-foreground");
        }
    }

    function loadParse() {
        if (window.Parse && window.Parse.User) {
            return Promise.resolve(window.Parse);
        }

        if (window.__earnxParsePromise) {
            return window.__earnxParsePromise;
        }

        window.__earnxParsePromise = new Promise(function (resolve, reject) {
            const script = document.createElement("script");

            script.src = "https://unpkg.com/parse@4.3.0/dist/parse.min.js";

            script.onload = function () {
                try {
                    const config = window.BACK4APP_CONFIG || {};

                    const applicationId =
                        config.applicationId ||
                        localStorage.getItem("BACK4APP_APPLICATION_ID") ||
                        "";

                    const javascriptKey =
                        config.javascriptKey ||
                        localStorage.getItem("BACK4APP_JAVASCRIPT_KEY") ||
                        "";

                    const serverURL =
                        config.serverURL ||
                        localStorage.getItem("BACK4APP_SERVER_URL") ||
                        "https://parseapi.back4app.com";

                    if (
                        !applicationId ||
                        applicationId === "YOUR_BACK4APP_APPLICATION_ID"
                    ) {
                        throw new Error(
                            "Add your real Back4App Application ID to back4app-config.js before requesting a password reset."
                        );
                    }

                    window.Parse.initialize(
                        applicationId,
                        javascriptKey
                    );

                    window.Parse.serverURL = serverURL;

                    resolve(window.Parse);
                } catch (error) {
                    reject(error);
                }
            };

            script.onerror = function () {
                reject(
                    new Error(
                        "The Back4App SDK could not be loaded. Check your internet connection and try again."
                    )
                );
            };

            document.head.appendChild(script);
        });

        return window.__earnxParsePromise;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
            showMessage(
                "Enter the email address associated with your account.",
                "error"
            );

            emailInput.focus();
            return;
        }

        if (!emailInput.checkValidity()) {
            showMessage(
                "Enter a valid email address.",
                "error"
            );

            emailInput.focus();
            return;
        }

        button.disabled = true;
        buttonText.textContent = "Sending reset link…";
        message.classList.add("hidden");

        try {
            const ParseSDK = await loadParse();

            await ParseSDK.User.requestPasswordReset(email);

            showMessage(
                "If an account exists for that email address, Back4App will send a password-reset email. Check your inbox and spam folder.",
                "success"
            );

            form.reset();
        } catch (error) {
            console.error(
                "Back4App password reset error:",
                error
            );

            showMessage(
                error && error.message
                    ? error.message
                    : "The password-reset request could not be completed. Please try again.",
                "error"
            );
        } finally {
            button.disabled = false;
            buttonText.textContent = "Send reset link";
        }
    });
})();
</script>
</body>
</html>
